# Local orchestration: Airflow in standalone mode with the project mounted in.
#   docker compose up --build   ->  http://localhost:8080  (credentials are printed in the logs)
services:
  airflow:
    build: .
    command: standalone
    ports: ["8080:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
    volumes:
      - .:/opt/airflow/project
