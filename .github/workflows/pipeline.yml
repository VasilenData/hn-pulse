name: pipeline

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["docs/data.json", "data/**"]

permissions:
  contents: write

# All triggers append to the same history and publish to the same branch.
concurrency:
  group: hn-pulse-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Lint
        run: pip install ruff && ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Dashboard freshness regression tests
        run: node --test tests_js/*.test.mjs
      - name: Extract
        run: python extract.py
      - name: Freshness gate
        run: python quality.py gate
      - name: Transform and test with dbt
        run: dbt build --profiles-dir .
      - name: Export dashboard data (includes the pipeline-health summary)
        run: python export.py
      - name: Refresh lineage diagram
        run: python lineage.py
      - name: Commit new snapshot and dashboard data
        run: |
          git config user.name "hn-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs LINEAGE.md
          git diff --cached --quiet || git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
