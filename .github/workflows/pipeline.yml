name: pipeline

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "data/**"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Extract
        run: python extract.py
      - name: Transform and test with dbt
        run: dbt build --profiles-dir .
      - name: Export dashboard data
        run: python export.py
      - name: Commit new snapshot and dashboard data
        run: |
          git config user.name "hn-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
